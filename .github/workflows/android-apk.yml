# Lean Android build (arm64-v8a, installable APK) for this fork. Every successful build is also
# published as the only GitHub release ("build<n>", counting from 1), which is what the in-app
# update check looks at. Older releases and their tags are removed after each publish.
#
# Uses the fork's fixed public development key unless all private signing secrets are supplied.
# Every APK certificate is checked before publication. The new fixed key cannot update build1.
name: android-apk

on:
  workflow_dispatch:
  push:
    branches: [ azaharplus-mmj ]
    paths-ignore: [ '**.md', 'docs/**' ]

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: time_macros
      # Public certificate fingerprint of the existing build1 / installed application.
      LEGACY_SIGNER_SHA256: 32bf0bafed6c6006adf302bbe090208778cebeff49e033fe2623c11231beeb3c
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Decide build number
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Next number = newest existing release + 1 (1 when there is none).
          LAST=$(gh api "repos/${{ github.repository }}/releases?per_page=100" --paginate \
            --jq '.[].tag_name' | sed -nE 's/^build-?([0-9]+)$/\1/p' | sort -n | tail -1)
          N=$(( ${LAST:-0} + 1 ))
          echo "n=$N" >> "$GITHUB_OUTPUT"
          echo "Build number: $N"
      - name: Cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-android-apk-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-android-apk-
      - name: Install tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ccache
      - name: Install CMake for the Android SDK
        run: echo "y" | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager "cmake;3.30.3"
      - name: Select persistent signing key
        id: signing
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PRIVATE_SIGNER_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ] && [ -n "$KS_ALIAS" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASS=$KS_PASS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=$KS_ALIAS" >> "$GITHUB_ENV"
            echo "EXPECTED_SIGNER_SHA256=${PRIVATE_SIGNER_SHA256:-$LEGACY_SIGNER_SHA256}" >> "$GITHUB_ENV"
            echo "source=private" >> "$GITHUB_OUTPUT"
          elif [ -n "$KS_B64$KS_PASS$KS_ALIAS" ]; then
            echo "::error::Private signing configuration is incomplete. Supply all three secrets or none."
            exit 1
          else
            echo "EXPECTED_SIGNER_SHA256=$(tr -d '\r\n' < src/android/keystore/mmj-development.sha256)" >> "$GITHUB_ENV"
            echo "source=development" >> "$GITHUB_OUTPUT"
            echo "Using the fork's persistent development key. This signing identity cannot update legacy build1."
          fi
      - name: Build (arm64-v8a, vanilla)
        working-directory: src/android
        run: |
          export NDK_CCACHE=$(which ccache)
          chmod +x ./gradlew
          JAVA_HOME=$JAVA_HOME_17_X64 ./gradlew assembleVanillaRelease -Pabi=arm64-v8a -PappIdSuffix=.mmj -PmmjBuild=${{ steps.ver.outputs.n }}
          ccache -s
      - name: Verify update signing certificate
        run: |
          SIGNER="${ANDROID_SDK_ROOT}/build-tools/35.0.0/apksigner"
          for apk in src/android/app/build/outputs/apk/vanilla/release/*.apk; do
            CERTS=$("$SIGNER" verify --print-certs "$apk")
            ACTUAL=$(printf '%s\n' "$CERTS" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr '[:upper:]' '[:lower:]')
            COUNT=$(printf '%s\n' "$CERTS" | grep -c '^Signer #[0-9]* certificate SHA-256 digest:')
            if [ "$COUNT" != 1 ] || [ "$ACTUAL" != "$EXPECTED_SIGNER_SHA256" ]; then
              echo "::error::APK certificate does not match the selected persistent signing key."
              exit 1
            fi
          done
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: azahar-plus-mmj-arm64-${{ github.sha }}
          path: src/android/app/build/outputs/apk/vanilla/release/*.apk
          if-no-files-found: error
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNING_SOURCE: ${{ steps.signing.outputs.source }}
        run: |
          N=${{ steps.ver.outputs.n }}
          SHORT=$(git rev-parse --short HEAD)
          BASE="2126.2-A" # AzaharPlus release this fork is based on
          APK="azahar-plus-mmj-arm64-build${N}.apk"
          cp src/android/app/build/outputs/apk/vanilla/release/*.apk "$APK"
          {
            echo "Azahar+ mmj ${BASE} build ${N} (app version v1.${N}) is AzaharPlus ${BASE} with the Citra MMJ per-game hacks, plus the changes listed below."
            echo "Unofficial fork made with AI. Only arm64. Commit ${SHORT}."
            echo
            echo "**Changes in this version**"
            echo
            echo "This page only lists what changed in this version. The README has the full feature list."
            echo
            cat docs/RELEASE_NOTES.md
            echo
            if [ "$SIGNING_SOURCE" = development ]; then
              echo "Signing: fixed public development key, reused for future builds."
              echo "Legacy build1 used a different temporary key; this APK cannot update that installation. A one-time migration is required before future in-place updates can work."
            fi
            echo "No games, keys or firmware are included. Not affiliated with Azahar, AzaharPlus, Citra, Citra MMJ or Nintendo."
          } > notes.md
          gh release create "build${N}" "$APK" --target "$GITHUB_SHA" \
            --title "Azahar+ mmj ${BASE} build ${N}" --notes-file notes.md --latest
      - name: Keep only the newest build release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 200 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | test("^build-?[0-9]+$"))] | sort_by(.createdAt) | reverse | .[1:] | .[].tagName' |
            while read -r tag; do gh release delete "$tag" --cleanup-tag --yes; done

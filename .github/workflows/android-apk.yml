# Lean Android build (arm64-v8a, installable APK) for this fork. Every successful build is also
# published as the only GitHub release ("build<n>", counting from 1), which is what the in-app
# update check looks at. Older releases and their tags are removed after each publish.
#
# Optional repository secrets for a FIXED signing key (needed so a new build can be installed over
# the previous one): ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASS, ANDROID_KEY_ALIAS.
# Without them the APK is signed with a throw-away debug key and cannot update an older install.
name: android-apk

on:
  workflow_dispatch:
  push:
    branches: [ azaharplus-mmj ]
    paths-ignore: [ '**.md', 'docs/**' ]

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: time_macros
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Decide build number
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Next number = newest existing release + 1 (1 when there is none).
          LAST=$(gh api "repos/${{ github.repository }}/releases?per_page=100" --paginate \
            --jq '.[].tag_name' | sed -nE 's/^build-?([0-9]+)$/\1/p' | sort -n | tail -1)
          N=$(( ${LAST:-0} + 1 ))
          echo "n=$N" >> "$GITHUB_OUTPUT"
          echo "Build number: $N"
          # Drop leftover tags without a release (they would be reused by the release step).
          RELTAGS=$(gh api "repos/${{ github.repository }}/releases?per_page=100" --paginate --jq '.[].tag_name')
          git ls-remote --tags origin | sed -nE 's#.*refs/tags/(build-?[0-9]+)$#\1#p' | while read -r tag; do
            if ! echo "$RELTAGS" | grep -qx "$tag"; then
              echo "Deleting orphan tag $tag"
              git push origin ":refs/tags/$tag" || true
            fi
          done
      - name: Cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-android-apk-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-android-apk-
      - name: Install tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ccache
      - name: Install CMake for the Android SDK
        run: echo "y" | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager "cmake;3.30.3"
      - name: Prepare signing key (optional)
        id: signing
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ] && [ -n "$KS_ALIAS" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASS=$KS_PASS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=$KS_ALIAS" >> "$GITHUB_ENV"
            echo "fixed=true" >> "$GITHUB_OUTPUT"
          else
            echo "fixed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No signing secrets: using a throw-away debug key (updates over an older install will fail)."
          fi
      - name: Build (arm64-v8a, vanilla)
        working-directory: src/android
        run: |
          export NDK_CCACHE=$(which ccache)
          chmod +x ./gradlew
          JAVA_HOME=$JAVA_HOME_17_X64 ./gradlew assembleVanillaRelease -Pabi=arm64-v8a -PappIdSuffix=.mmj -PmmjBuild=${{ steps.ver.outputs.n }}
          ccache -s
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: azahar-plus-mmj-arm64-${{ github.sha }}
          path: src/android/app/build/outputs/apk/vanilla/release/*.apk
          if-no-files-found: error
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          FIXED_KEY: ${{ steps.signing.outputs.fixed }}
        run: |
          N=${{ steps.ver.outputs.n }}
          SHORT=$(git rev-parse --short HEAD)
          BASE="2126.2-A" # AzaharPlus release this fork is based on
          APK="azahar-plus-mmj-arm64-build${N}.apk"
          cp src/android/app/build/outputs/apk/vanilla/release/*.apk "$APK"
          {
            echo "Azahar+ mmj ${BASE} build ${N} (app version v1.${N}) is AzaharPlus ${BASE} with the Citra MMJ per-game hacks, plus the changes listed below."
            echo "Unofficial fork made with AI. Only arm64. Commit ${SHORT}."
            echo
            echo "**Changes in this version**"
            echo
            echo "This page only lists what changed in this version. The README has the full feature list."
            echo
            cat docs/RELEASE_NOTES.md
            echo
            if [ "$FIXED_KEY" != "true" ]; then
              echo "> This build is signed with a temporary key. If Android reports a package conflict or refuses to install it over an older copy, uninstall the old app first (back up your data folder)."
            fi
            echo "No games, keys or firmware are included. Not affiliated with Azahar, AzaharPlus, Citra, Citra MMJ or Nintendo."
          } > notes.md
          gh release create "build${N}" "$APK" --target "$GITHUB_SHA" \
            --title "Azahar+ mmj ${BASE} build ${N}" --notes-file notes.md --latest
      - name: Keep only the newest build release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 200 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | test("^build-?[0-9]+$"))] | sort_by(.createdAt) | reverse | .[1:] | .[].tagName' |
            while read -r tag; do gh release delete "$tag" --cleanup-tag --yes; done

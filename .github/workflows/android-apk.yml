# Lean Android build (arm64-v8a, installable APK) for this fork.
# It only runs in repositories owned by axelconde7w7-gif and uses no secrets.
name: android-apk

on:
  workflow_dispatch:
  push:
    branches: [ AzaharPlus ]
    paths-ignore: [ '**.md', 'docs/**' ]

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    if: ${{ github.repository_owner == 'axelconde7w7-gif' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: time_macros
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-android-apk-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-android-apk-
      - name: Install tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ccache
      - name: Install CMake for the Android SDK
        run: echo "y" | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager "cmake;3.30.3"
      - name: Build (arm64-v8a, vanilla, debug-signed release)
        working-directory: src/android
        run: |
          export NDK_CCACHE=$(which ccache)
          chmod +x ./gradlew
          JAVA_HOME=$JAVA_HOME_17_X64 ./gradlew assembleVanillaRelease -Pabi=arm64-v8a -PappIdSuffix=.mmj
          ccache -s
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: azaharplus-mmj-arm64-${{ github.sha }}
          path: src/android/app/build/outputs/apk/vanilla/release/*.apk
          if-no-files-found: error

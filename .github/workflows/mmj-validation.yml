name: MMJ integration validation

on:
  pull_request:
    branches: [azaharplus-mmj]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mmj-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load test dependency and pinned MMJ reference
        run: |
          git submodule update --init externals/catch2
          git fetch --no-tags --depth=1 https://github.com/weihuoya/citra.git 302b0c3bc4312bc96489c11584a97664894b343f
      - name: Verify MMJ title lists against original source
        run: python3 tools/verify-mmj-port.py
      - name: Build and run native regression tests
        run: |
          cmake -S src/tests/mmj -B build-mmj -DCMAKE_BUILD_TYPE=Release
          cmake --build build-mmj --parallel 2
          ctest --test-dir build-mmj --output-on-failure

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android CMake
        run: echo y | "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" 'cmake;3.30.3'
      - name: Compile arm64 APK
        working-directory: src/android
        run: |
          chmod +x gradlew
          ./gradlew assembleVanillaRelease -Pabi=arm64-v8a -PappIdSuffix=.mmj
      - name: Verify persistent development signature
        run: |
          EXPECTED=$(tr -d '\r\n' < src/android/keystore/mmj-development.sha256)
          SIGNER="${ANDROID_SDK_ROOT}/build-tools/35.0.0/apksigner"
          for apk in src/android/app/build/outputs/apk/vanilla/release/*.apk; do
            CERTS=$("$SIGNER" verify --print-certs "$apk")
            ACTUAL=$(printf '%s\n' "$CERTS" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
            COUNT=$(printf '%s\n' "$CERTS" | grep -c '^Signer #[0-9]* certificate SHA-256 digest:')
            test "$COUNT" = 1
            test "$ACTUAL" = "$EXPECTED"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: mmj-validation-arm64
          path: src/android/app/build/outputs/apk/vanilla/release/*.apk
          if-no-files-found: error
